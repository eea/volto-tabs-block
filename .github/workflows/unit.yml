name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        volto-version: [18.35.1, 19.3.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install with Volto ${{ matrix.volto-version }}
        run: >-
          pnpm add --save-dev
          @plone/volto@${{ matrix.volto-version }}
          --config.auto-install-peers=false

      - name: Run Vitest
        run: pnpm test
